# E-31: the k3s-core lane's single-deploy chain (design-07 17.1 31-deploy-basic.test.ts).
project_name: k3s-basic
orchestrator: k3s
stack_management:
  keep_releases: 3
  cleanup_on_failure: true
health_checks:
  on_failure: rollback
  endpoints:
    - { name: web, url: "http://127.0.0.1:8081/", remote: true, expected_status: 200, retries: 10, retry_delay: 3 }
