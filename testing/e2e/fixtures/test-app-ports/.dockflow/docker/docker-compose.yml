services:
  # in firewall.public_ports
  web:
    image: nginx:alpine
    ports:
      - "8094:80"
    deploy:
      replicas: 1
      # a short monitor: each redeploy otherwise waits Dockflow's default
      update_config:
        monitor: 5s
  # published, not declared: closed to the internet
  admin:
    image: nginx:alpine
    ports:
      - "8095:80"
    deploy:
      replicas: 1
      # a short monitor: each redeploy otherwise waits Dockflow's default
      update_config:
        monitor: 5s
