# E-50-12/E-50-16: an accessory with its own explicit Traefik router labels and no published port
# (`expose`, not `ports`), so the default-route injection gate (non-empty `ports`) never fires for
# it and its route exists only because of the labels below. Accessories are never built: it runs the
# baked nginx image and serves a marker of its own, so a response proves the route reaches it.
services:
  admin:
    image: nginx:alpine
    command: ["sh", "-c", "echo DOCKFLOW_E2E_PROXY_ADMIN > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
    expose:
      - "80"
    # top-level `labels` (not `deploy.labels`): design-01 7.1 — Kubernetes reads `labels`, Swarm's
    # Traefik provider reads `deploy.labels` only.
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin.rule: "Host(`admin.k3s.e2e.test`)"
