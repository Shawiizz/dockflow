services:
  web:
    image: nginx:alpine
    ports:
      - "8098:80"
    # the app reaches the accessory through the accessories stack's default network
    networks:
      - default
      - accessories
    deploy:
      replicas: 2
      # a short monitor: each update otherwise waits Dockflow's default
      update_config:
        monitor: 5s

  # one task per node, so `scale` has a service it must refuse
  agent:
    image: nginx:alpine
    deploy:
      mode: global
      update_config:
        monitor: 5s

networks:
  accessories:
    external: true
    name: test-app-day2-test-accessories_default
