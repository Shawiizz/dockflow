apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-e2e-broken
  labels:
    app.kubernetes.io/name: e2e-broken
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-broken
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-broken
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: broken
          # anonymous e2e registry (design-07 16.7), deliberately missing so the pull fails
          image: localhost:35010/e2e/does-not-exist:1
