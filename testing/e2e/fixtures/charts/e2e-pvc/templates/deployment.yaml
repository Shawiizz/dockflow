apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-e2e-pvc
  labels:
    app.kubernetes.io/name: e2e-pvc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-pvc
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-pvc
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: writer
          image: busybox:1.37
          command: ["sh", "-c", "echo pvc-ready > /data/ready; sleep 36000"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-e2e-pvc
