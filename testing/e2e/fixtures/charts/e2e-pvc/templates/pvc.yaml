apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-e2e-pvc
  labels:
    app.kubernetes.io/name: e2e-pvc
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: dockflow-local
  resources:
    requests:
      storage: {{ .Values.storage }}
