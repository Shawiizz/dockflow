apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-e2e-web
  labels:
    app.kubernetes.io/name: e2e-web
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-web
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if eq .Chart.Version "0.2.0" }}
        chart-version: "0.2.0"
        {{- end }}
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: message
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: message
          configMap:
            name: {{ .Release.Name }}-e2e-web
            items:
              - key: message
                path: index.html
