{{- if .Values.hook.enabled }}
# post-install/post-upgrade hook (design-07 E-51-03): `before-hook-creation` replaces this Job on
# every revision that actually upgrades, so its `metadata.uid` is the marker an unchanged redeploy
# must leave untouched — Dockflow skips the Helm call entirely for an unchanged release, so the hook
# never runs and the Job this returns stays exactly as it was.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-e2e-web-hook
  labels:
    app.kubernetes.io/name: e2e-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: hook
          image: busybox:1.37
          command: ["sh", "-c", "echo hook-ran"]
{{- end }}
