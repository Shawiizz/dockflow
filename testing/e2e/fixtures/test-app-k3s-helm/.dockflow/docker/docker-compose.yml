# `site`, not `web`: 51-helm-app names its Helm release web, and a release may not share a
# compose service's name
services:
  site:
    image: helm-e2e-app
    build:
      context: ../..
      dockerfile: .dockflow/docker/Dockerfile.web
    ports:
      - "8082:80"
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 2s
        monitor: 2s
      restart_policy:
        condition: on-failure
