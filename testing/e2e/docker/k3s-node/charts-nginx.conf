# Helm chart repositories of the k3s e2e lanes, served over plain HTTP on purpose (http:// repositories
# are accepted with a warning). /public is anonymous, /private needs basic auth (user e2e, written to
# .cache/auth/htpasswd-charts by helpers/cluster.ts). tools/package-charts.ts fills both directories.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /public/ {
        autoindex off;
    }

    location /private/ {
        autoindex off;
        auth_basic "e2e";
        auth_basic_user_file /auth/htpasswd-charts;
    }

    location / {
        return 404;
    }
}
