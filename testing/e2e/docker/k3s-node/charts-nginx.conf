# Helm chart repositories of the k3s e2e lanes. /public is anonymous plain HTTP (http:// repositories
# are accepted with a warning). /private needs basic auth (user e2e, written to
# .cache/auth/htpasswd-charts by helpers/cluster.ts) and is served over HTTPS only, since Dockflow
# never sends a repository password over http://; its certificate comes from the harness's test CA,
# which the nodes trust. tools/package-charts.ts fills both directories.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /public/ {
        autoindex off;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/charts-cert.pem;
    ssl_certificate_key /etc/nginx/tls/charts-key.pem;
    root /usr/share/nginx/html;

    location /private/ {
        autoindex off;
        auth_basic "e2e";
        auth_basic_user_file /auth/htpasswd-charts;
    }

    location / {
        return 404;
    }
}
