# k3s e2e topologies. Started by testing/e2e/helpers/cluster.ts (startTopology), which sets the
# project (-p dockflow-k3s for the shared lanes, dockflow-k3s-setup for the setup lane), E2E_NET,
# the E2E_PORT_* SSH ports, E2E_NODE_IMAGE and the images pinned in k3s/images.lock.json.
# Profiles: duo (server-1, agent-1), trio (+ agent-2), ha (server-1..3, agent-1); every profile also
# starts registry, registry-auth, charts, outsider, acme and acme-dns.
# The nodes boot systemd only: `dockflow setup k3s` installs k3s on them.

x-node: &node
  image: ${E2E_NODE_IMAGE:-dockflow-e2e-k3s-node:local}
  privileged: true
  cgroup: private
  stop_signal: SIGRTMIN+3
  tmpfs:
    - /run
    - /run/lock
    - /tmp:exec,mode=1777
  volumes:
    - /lib/modules:/lib/modules:ro
    - /var/lib/rancher/k3s
    - /var/lib/kubelet
    - /var/log
  environment:
    E2E_REGISTRY_ADDR: ${E2E_NET:-10.197.30}.5:5000
    E2E_REGISTRY_AUTH_ADDR: ${E2E_NET:-10.197.30}.6:5000
  extra_hosts:
    - "k3s.e2e.test:127.0.0.1"
    - "dashboard.k3s.e2e.test:127.0.0.1"
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck.k3s.sh"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

services:
  # servers put the k3s datastore (sqlite or etcd) on tmpfs: fsync latency on shared runner disks
  # breaks HA leader elections. Compose replaces sequences, so the tmpfs list is repeated.
  server-1:
    <<: *node
    hostname: server-1
    profiles: [duo, trio, ha]
    tmpfs: [/run, /run/lock, "/tmp:exec,mode=1777", "/var/lib/rancher/k3s/server/db:size=1g"]
    ports: ["${E2E_PORT_SERVER_1:-32230}:22"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.11" } }
  server-2:
    <<: *node
    hostname: server-2
    profiles: [ha]
    tmpfs: [/run, /run/lock, "/tmp:exec,mode=1777", "/var/lib/rancher/k3s/server/db:size=1g"]
    ports: ["${E2E_PORT_SERVER_2:-32231}:22"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.12" } }
  server-3:
    <<: *node
    hostname: server-3
    profiles: [ha]
    tmpfs: [/run, /run/lock, "/tmp:exec,mode=1777", "/var/lib/rancher/k3s/server/db:size=1g"]
    ports: ["${E2E_PORT_SERVER_3:-32232}:22"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.13" } }
  agent-1:
    <<: *node
    hostname: agent-1
    profiles: [duo, trio, ha]
    ports: ["${E2E_PORT_AGENT_1:-32233}:22"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.21" } }
  agent-2:
    <<: *node
    hostname: agent-2
    profiles: [trio]
    ports: ["${E2E_PORT_AGENT_2:-32234}:22"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.22" } }
  registry:
    image: ${E2E_REGISTRY_IMAGE:-docker.io/library/registry:3}
    profiles: [duo, trio, ha]
    ports: ["${E2E_PORT_REGISTRY:-35010}:5000"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.5" } }
  registry-auth:
    image: ${E2E_REGISTRY_IMAGE:-docker.io/library/registry:3}
    profiles: [duo, trio, ha]
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: e2e
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes: ["../.cache/auth:/auth:ro"]
    ports: ["${E2E_PORT_REGISTRY_AUTH:-35011}:5000"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.6" } }
  charts:
    image: ${E2E_NGINX_IMAGE:-docker.io/library/nginx:alpine}
    profiles: [duo, trio, ha]
    volumes:
      - ../.cache/charts:/usr/share/nginx/html:ro
      - ../.cache/auth:/auth:ro
      - ./k3s-node/charts-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${E2E_PORT_CHARTS:-35012}:8080"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.7" } }
  outsider:
    image: ${E2E_NODE_IMAGE:-dockflow-e2e-k3s-node:local}
    profiles: [duo, trio, ha]
    entrypoint: ["sleep", "infinity"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.99" } }
  # ACME test CA for the proxy lane (K49). Traefik points at it through proxy.acme_ca_server;
  # acme-dns (pebble-challtestsrv) answers the A query for the test domain with a node address, so
  # the HTTP-01 challenge lands on Traefik's own port 80. The CA of Pebble's ACME API certificate
  # (.cache/acme/pebble.minica.pem, generated by the harness) is copied into the fixture's .dockflow/
  # and named by proxy.acme_ca_bundle, which Dockflow mounts and exposes through LEGO_CA_CERTIFICATES
  # (design-04 2.3.1): the harness never edits the Traefik values itself.
  acme:
    image: ${E2E_PEBBLE_IMAGE:-ghcr.io/letsencrypt/pebble:2.7.0}
    profiles: [duo, trio, ha]
    command: ["-config", "/etc/pebble/pebble-config.json", "-dnsserver", "${E2E_NET:-10.197.30}.9:8053"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - "../fixtures/acme/pebble-config.json:/etc/pebble/pebble-config.json:ro"
      - "../.cache/acme:/etc/pebble/certs:ro"
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.8" } }
  acme-dns:
    image: ${E2E_PEBBLE_CHALLTESTSRV_IMAGE:-ghcr.io/letsencrypt/pebble-challtestsrv:2.7.0}
    profiles: [duo, trio, ha]
    command: ["-http01", "", "-tlsalpn01", "", "-https01", "", "-defaultIPv4", "${E2E_NET:-10.197.30}.11"]
    networks: { k3s: { ipv4_address: "${E2E_NET:-10.197.30}.9" } }

networks:
  k3s:
    driver: bridge
    ipam:
      config:
        - subnet: "${E2E_NET:-10.197.30}.0/24"
