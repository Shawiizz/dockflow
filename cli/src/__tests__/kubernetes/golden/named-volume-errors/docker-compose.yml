services:
  rwo-replicas:
    image: nginx:1.27
    deploy:
      replicas: 3
    volumes:
      - vol1:/data
  rwx-default:
    image: nginx:1.27
    volumes:
      - vol2:/data
  global-rwo:
    image: busybox:1.36
    command: ["sleep", "3600"]
    deploy:
      mode: global
    volumes:
      - vol3:/data
  global-ext:
    image: busybox:1.36
    command: ["sleep", "3600"]
    deploy:
      mode: global
    volumes:
      - vol4:/data
  rwop-a:
    image: nginx:1.27
    volumes:
      - vol5:/data
  rwop-b:
    image: nginx:1.27
    volumes:
      - vol5:/data2
  perrep-a:
    image: postgres:16
    x-dockflow:
      kind: statefulset
    volumes:
      - vol6:/data
  perrep-b:
    image: postgres:16
    x-dockflow:
      kind: statefulset
    volumes:
      - vol6:/data2

volumes:
  vol1:
  vol2:
    x-dockflow:
      access_mode: ReadWriteMany
  vol3:
  vol4:
    external: true
    name: vol4-external-claim
  vol5:
    x-dockflow:
      access_mode: ReadWriteOncePod
  vol6:
    x-dockflow:
      per_replica: true
