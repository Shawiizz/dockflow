apiVersion: apps/v1
kind: Deployment
metadata:
  name: delay-ratio
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: delay-ratio
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: delay-ratio
