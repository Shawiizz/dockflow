# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-volume: postgres_data
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
    dockflow.shawiizz.dev/volume: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: dockflow-local
---
apiVersion: v1
kind: Service
metadata:
  name: queue
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: queue
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: queue
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  selector:
    dockflow.shawiizz.dev/service: queue
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: queue-hl
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: queue
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: queue
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  selector:
    dockflow.shawiizz.dev/service: queue
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: web
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  selector:
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: web
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: web
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: web
        kubectl.kubernetes.io/default-container: web
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: web
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: web
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: pvc-postgres-data
              mountPath: /var/lib/postgresql/data
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: web
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: pvc-postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: queue
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: queue
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: queue
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: queue
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: queue
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  serviceName: queue-hl
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: queue
        kubectl.kubernetes.io/default-container: queue
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: queue
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: queue
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: queue
          image: postgres:16
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: queue-data
              mountPath: /var/lib/postgresql/data
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: queue
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
    - metadata:
        name: queue-data
        annotations:
          dockflow.shawiizz.dev/compose-volume: queue_data
        labels:
          app.kubernetes.io/instance: dockflow-shop-production
          app.kubernetes.io/managed-by: dockflow
          app.kubernetes.io/part-of: shop
          dockflow.shawiizz.dev/part: stack
          dockflow.shawiizz.dev/role: app
          dockflow.shawiizz.dev/stack: dockflow-shop-production
          dockflow.shawiizz.dev/volume: queue-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: dockflow-local
