# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: Service
metadata:
  name: hostmode
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hostmode
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hostmode
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: hostmode
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  ports:
    - name: tcp-9000
      port: 9000
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: hostmode
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: hostport
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hostport
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hostport
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: hostport
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  ports:
    - name: tcp-8000
      port: 8000
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: hostport
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostmode
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hostmode
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hostmode
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: hostmode
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: hostmode
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: hostmode
        kubectl.kubernetes.io/default-container: hostmode
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: hostmode
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: hostmode
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hostmode
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-9000
              containerPort: 9000
              hostIP: 10.0.0.5
              hostPort: 9000
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: hostmode
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostport
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hostport
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hostport
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: hostport
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: hostport
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: hostport
        kubectl.kubernetes.io/default-container: hostport
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: hostport
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: hostport
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hostport
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-8000
              containerPort: 8000
              hostIP: 127.0.0.1
              hostPort: 8000
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: hostport
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
