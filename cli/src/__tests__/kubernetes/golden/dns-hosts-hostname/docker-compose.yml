services:
  web:
    image: nginx:1.27
    hostname: webhost
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_search:
      - internal.example.com
      - svc.cluster.local
    dns_opt:
      - "ndots:2"
      - use-vc
      - "ndots:3"
    extra_hosts:
      db.internal: "10.0.0.5"
      legacy.internal: "10.0.0.5"

  worker:
    image: busybox:1.36
    command: ["sleep", "3600"]
    extra_hosts:
      - "cache.internal=10.0.0.6"
      - "cache2.internal=10.0.0.6"
