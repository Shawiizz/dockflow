---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mgr
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: mgr
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: mgr
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: mgr
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: mgr
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: mgr
        kubectl.kubernetes.io/default-container: mgr
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: mgr
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: mgr
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  dockflow.shawiizz.dev/service: mgr
                  dockflow.shawiizz.dev/stack: dockflow-shop-production
              matchLabelKeys:
                - pod-template-hash
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
        - name: mgr
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: mgr
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: mgr
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: zone
          whenUnsatisfiable: ScheduleAnyway
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: mgr
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: rack
          whenUnsatisfiable: ScheduleAnyway
