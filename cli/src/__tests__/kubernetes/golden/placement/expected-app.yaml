    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: pinned
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: pinned
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: pinned
        kubectl.kubernetes.io/default-container: pinned
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: pinned
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: pinned
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zone
                    operator: NotIn
                    values:
                      - east
                      - west
      automountServiceAccountToken: false
      containers:
        - name: pinned
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: worker-1
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      tolerations:
        - effect: NoSchedule
          key: dedicated
          value: batch
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: pinned
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
