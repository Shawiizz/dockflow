# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: cache
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: cache
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  ports:
    - name: tcp-80
      port: 80
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: cache
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: cache-lb
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: cache
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: cache
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  ports:
    - name: tcp-80
      port: 8080
      protocol: TCP
      targetPort: 80
  selector:
    dockflow.shawiizz.dev/service: cache
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: cache
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: cache
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: cache
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: cache
        kubectl.kubernetes.io/default-container: cache
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: cache
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: cache
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cache
          image: redis:7.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-80
              containerPort: 80
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: cache
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
