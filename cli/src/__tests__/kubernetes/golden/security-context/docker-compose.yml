services:
  api:
    image: nginx:1.27
    user: "1000:1000"
    group_add:
      - "3000"
      - "4000"
    cap_add:
      - CAP_NET_ADMIN
      - SYS_TIME
    cap_drop:
      - CAP_MKNOD
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    sysctls:
      net.ipv4.tcp_syncookies: "1"

  worker:
    image: busybox:1.36
    command: ["sleep", "3600"]
    privileged: true
    pid: host

  helper:
    image: busybox:1.36
    command: ["sleep", "3600"]
    init: true
