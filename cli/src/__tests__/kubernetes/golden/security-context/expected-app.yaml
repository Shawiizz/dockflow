      annotations:
        dockflow.shawiizz.dev/compose-service: worker
        kubectl.kubernetes.io/default-container: worker
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: worker
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: worker
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          args:
            - sleep
            - "3600"
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
      enableServiceLinks: false
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: worker
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
