---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: api
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: api
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: api
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: api
        kubectl.kubernetes.io/default-container: api
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: api
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: api
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
                - SYS_TIME
              drop:
                - MKNOD
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsUser: 1000
      enableServiceLinks: false
      securityContext:
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: Unconfined
        supplementalGroups:
          - 3000
          - 4000
        sysctls:
          - name: net.ipv4.tcp_syncookies
            value: "1"
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: api
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
---
apiVersion: apps/v1
kind: Deployment
metadata:
