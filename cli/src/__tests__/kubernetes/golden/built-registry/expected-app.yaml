# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: app
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  ports:
    - name: placeholder
      port: 9
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: worker
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  ports:
    - name: placeholder
      port: 9
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: app
    dockflow.shawiizz.dev/release: 1.4.2
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: app
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: app
        kubectl.kubernetes.io/default-container: app
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: app
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: app
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.example.com/shop/app:1.4.2
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      imagePullSecrets:
        - name: dockflow-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: app
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: worker
    dockflow.shawiizz.dev/release: 1.4.2
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: worker
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: worker
        kubectl.kubernetes.io/default-container: worker
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: worker
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: worker
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: redis:7.2
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      imagePullSecrets:
        - name: dockflow-registry
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: worker
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
