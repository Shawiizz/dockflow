            matchLabels:
              dockflow.shawiizz.dev/service: app
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: anon-4f7cfe6f
          emptyDir: {}
        - name: tmpfs-0850a74c
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmpfs-e16b972c
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmpfs-e549f2e8
          emptyDir:
            medium: Memory
