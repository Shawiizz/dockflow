services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
      - "9090:9090/udp"
    expose:
      - "3000"
    environment:
      LOG_LEVEL: debug
      APP_NAME: shop
    env_file:
      - ./files/base.env
    labels:
      team: platform
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`shop.example.com`)"
      traefik.http.routers.web.middlewares: "strip"
      traefik.http.services.web.loadbalancer.server.port: "80"
      traefik.http.middlewares.strip.stripprefix.prefixes: "/api"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        monitor: 15s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      placement:
        preferences:
          - spread: node.labels.zone
    user: "1000:1000"
    cap_add:
      - CAP_NET_BIND_SERVICE
    read_only: true
    sysctls:
      net.ipv4.tcp_syncookies: "1"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - source: tls_cert
        target: tls/cert.pem
    hostname: webhost
    dns_search:
      - internal.example.com
    networks:
      - backend

  cache:
    image: redis:7
    tmpfs:
      - /tmp/scratch
    volumes:
      - /var/cache/local:/data

  queue:
    image: postgres:16
    x-dockflow:
      kind: statefulset
    deploy:
      replicas: 2
    volumes:
      - type: volume
        source: queue_data
        target: /var/lib/queue
        volume:
          nocopy: true

  agent:
    image: busybox:1.36
    command: ["sleep", "3600"]
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux
    x-dockflow:
      node_selector:
        tier: edge
      tolerations:
        - key: dedicated
          operator: Equal
          value: batch
          effect: NoSchedule

  migrate:
    image: busybox:1.36
    command: ["/bin/sh", "-c", "echo migrating"]
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  backend: {}

volumes:
  queue_data:
    x-dockflow:
      per_replica: true

secrets:
  tls_cert:
    file: ./files/tls_cert.txt

configs:
  nginx_conf:
    file: ./files/nginx.conf
