# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-volume: cache
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
    dockflow.shawiizz.dev/volume: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: dockflow-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-volume: data
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
    dockflow.shawiizz.dev/volume: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: dockflow-local
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: app
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  ports:
    - name: placeholder
      port: 9
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: app
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: app
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: app
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: app
        kubectl.kubernetes.io/default-container: app
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: app
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: app
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: pvc-cache
              mountPath: /var/cache/app
            - name: pvc-data
              mountPath: /var/lib/data
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: app
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: pvc-cache
          persistentVolumeClaim:
            claimName: cache
        - name: pvc-data
          persistentVolumeClaim:
            claimName: data
