apiVersion: apps/v1
kind: Deployment
metadata:
  name: hc-none
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hc-none
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hc-none
