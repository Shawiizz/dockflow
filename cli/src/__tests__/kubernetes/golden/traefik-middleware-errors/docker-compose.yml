services:
  web:
    image: nginx:1.27
    ports:
      - "8080:80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`web.example.com`)"
      traefik.http.routers.web.middlewares: "extmw@file,filemw,badopt,errbad"
      traefik.http.middlewares.filemw.basicauth.usersfile: "/etc/htpasswd"
      traefik.http.middlewares.badopt.stripprefix.prefixx: "/a"
      traefik.http.middlewares.errbad.errors.service: "ghost"
