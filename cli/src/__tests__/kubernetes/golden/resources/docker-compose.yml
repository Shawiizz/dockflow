services:
  limits-only:
    image: nginx:1.27
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

  reservations-only:
    image: nginx:1.27
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 12G

  both:
    image: nginx:1.27
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  pids-limited:
    image: nginx:1.27
    deploy:
      resources:
        limits:
          pids: 100
