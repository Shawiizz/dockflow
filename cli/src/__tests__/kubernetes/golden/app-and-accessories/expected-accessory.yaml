# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: accessory
# version: -
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: db
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: accessory
    dockflow.shawiizz.dev/service: db
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  clusterIP: None
  ports:
    - name: placeholder
      port: 9
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: db
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: db
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: accessory
    dockflow.shawiizz.dev/service: db
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: db
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: db
        kubectl.kubernetes.io/default-container: db
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: db
        dockflow.shawiizz.dev/role: accessory
        dockflow.shawiizz.dev/service: db
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: db
          image: postgres:16
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: db
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
