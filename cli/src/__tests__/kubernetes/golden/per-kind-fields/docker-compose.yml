services:
  api:
    image: nginx:1.27
    deploy:
      replicas: 2
  db:
    image: postgres:16
    x-dockflow:
      kind: statefulset
    volumes:
      - db_data:/var/lib/postgresql/data
  agent:
    image: busybox:1.36
    command: ["sleep", "3600"]
    deploy:
      mode: global
  migrate:
    image: busybox:1.36
    command: ["true"]
    deploy:
      mode: replicated-job
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  db_data:
