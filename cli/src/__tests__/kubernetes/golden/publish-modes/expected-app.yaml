---
apiVersion: v1
kind: Service
metadata:
  name: lb-svc-lb
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: lb-svc
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: lb-svc
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: lb-svc
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  loadBalancerSourceRanges:
    - 2001:db8::/32
    - 203.0.113.0/24
  ports:
    - name: tcp-80
      port: 8093
      protocol: TCP
      targetPort: 80
  selector:
    dockflow.shawiizz.dev/service: lb-svc
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
