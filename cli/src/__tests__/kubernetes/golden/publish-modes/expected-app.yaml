---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostport-svc
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: hostport-svc
    dockflow.shawiizz.dev/release: 1.4.2
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: hostport-svc
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: hostport-svc
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: hostport-svc
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: hostport-svc
        kubectl.kubernetes.io/default-container: hostport-svc
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: hostport-svc
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: hostport-svc
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hostport-svc
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-80
              containerPort: 80
              hostPort: 8091
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: hostport-svc
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
