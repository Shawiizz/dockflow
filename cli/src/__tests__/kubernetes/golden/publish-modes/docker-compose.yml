services:
  hostport-svc:
    image: nginx:1.27
    x-dockflow:
      publish: hostport
    ports:
      - "8091:80"
  none-svc:
    image: nginx:1.27
    x-dockflow:
      publish: none
    ports:
      - "8092:80"
  lb-svc:
    image: nginx:1.27
    x-dockflow:
      lb_source_ranges:
        - 203.0.113.0/24
        - 2001:db8::/32
    ports:
      - "8093:80"
