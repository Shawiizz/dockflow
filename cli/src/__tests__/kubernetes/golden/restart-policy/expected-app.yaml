---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restart-delay-window
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: restart-delay-window
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: restart-delay-window
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: restart-delay-window
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: restart-delay-window
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: restart-delay-window
        kubectl.kubernetes.io/default-container: restart-delay-window
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: restart-delay-window
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: restart-delay-window
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: restart-delay-window
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: restart-delay-window
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
