---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell-svc
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: shell-svc
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: shell-svc
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: shell-svc
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: shell-svc
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: shell-svc
        kubectl.kubernetes.io/default-container: shell-svc
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: shell-svc
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: shell-svc
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: shell-svc
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -f http://localhost:$$PORT/health
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -f http://localhost:$$PORT/health
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 30
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: shell-svc
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
