# dockflow-artifact: k8s-manifests/1
# stack: shop-production
# role: app
# version: 1.4.2
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: web
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  ports:
    - name: tcp-443
      port: 443
      protocol: TCP
    - name: tcp-3000
      port: 3000
      protocol: TCP
    - name: tcp-5432
      port: 5432
      protocol: TCP
    - name: tcp-6000
      port: 6000
      protocol: TCP
    - name: udp-6000
      port: 6000
      protocol: UDP
    - name: primary
      appProtocol: http
      port: 6500
      protocol: TCP
    - name: tcp-7000
      port: 7000
      protocol: TCP
    - name: colliding
      port: 7001
      protocol: TCP
  selector:
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: web
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  ports:
    - name: tcp-6000
      port: 6000
      protocol: TCP
      targetPort: 6000
    - name: udp-6000
      port: 6000
      protocol: UDP
      targetPort: 6000
    - name: primary
      appProtocol: http
      port: 6500
      protocol: TCP
      targetPort: 6500
    - name: secondary
      appProtocol: grpc
      port: 6600
      protocol: TCP
      targetPort: 6500
    - name: tcp-7000
      port: 7000
      protocol: TCP
      targetPort: 7000
    - name: tcp-7001
      port: 7001
      protocol: TCP
      targetPort: 7001
    - name: tcp-3000
      port: 8080
      protocol: TCP
      targetPort: 3000
    - name: tcp-3000-9090
      port: 9090
      protocol: TCP
      targetPort: 3000
    - name: tcp-443
      port: 9443
      protocol: TCP
      targetPort: 443
    - name: colliding
      port: 17001
      protocol: TCP
      targetPort: 7001
  selector:
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: web
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: web
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: web
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: web
        kubectl.kubernetes.io/default-container: web
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: web
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: web
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-443
              containerPort: 443
              protocol: TCP
            - name: tcp-3000
              containerPort: 3000
              protocol: TCP
            - name: tcp-5432
              containerPort: 5432
              protocol: TCP
            - name: tcp-6000
              containerPort: 6000
              protocol: TCP
            - name: udp-6000
              containerPort: 6000
              protocol: UDP
            - name: primary
              containerPort: 6500
              protocol: TCP
            - name: tcp-7000
              containerPort: 7000
              protocol: TCP
            - name: colliding
              containerPort: 7001
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: web
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
