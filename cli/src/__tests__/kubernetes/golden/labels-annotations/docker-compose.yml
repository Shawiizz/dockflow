services:
  web:
    image: nginx:1.27
    labels:
      team: platform
      note: from-labels
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`web.example.com`)"
    deploy:
      labels:
        release-tier: stable
    annotations:
      note: from-annotations
      owner: platform-team
