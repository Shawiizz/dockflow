  selector:
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: worker
    dockflow.shawiizz.dev/release: 1.4.2
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: worker
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: worker
        kubectl.kubernetes.io/default-container: worker
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: worker
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: worker
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-8080
              containerPort: 8080
              protocol: TCP
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: worker
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: worker--87eba76e
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: worker
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: worker
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`worker.example.com`)
      services:
        - name: worker
          port: 8080
