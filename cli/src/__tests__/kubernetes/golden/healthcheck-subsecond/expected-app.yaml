---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-custom-si
  namespace: dockflow-shop-production
  annotations:
    dockflow.shawiizz.dev/compose-service: svc-custom-si
  labels:
    app.kubernetes.io/instance: dockflow-shop-production
    app.kubernetes.io/managed-by: dockflow
    app.kubernetes.io/name: svc-custom-si
    app.kubernetes.io/part-of: shop
    dockflow.shawiizz.dev/part: stack
    dockflow.shawiizz.dev/role: app
    dockflow.shawiizz.dev/service: svc-custom-si
    dockflow.shawiizz.dev/stack: dockflow-shop-production
spec:
  minReadySeconds: 30
  progressDeadlineSeconds: 240
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      dockflow.shawiizz.dev/service: svc-custom-si
      dockflow.shawiizz.dev/stack: dockflow-shop-production
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        dockflow.shawiizz.dev/compose-service: svc-custom-si
        kubectl.kubernetes.io/default-container: svc-custom-si
      labels:
        app.kubernetes.io/instance: dockflow-shop-production
        app.kubernetes.io/name: svc-custom-si
        dockflow.shawiizz.dev/role: app
        dockflow.shawiizz.dev/service: svc-custom-si
        dockflow.shawiizz.dev/stack: dockflow-shop-production
    spec:
      automountServiceAccountToken: false
      containers:
        - name: svc-custom-si
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - "true"
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - "true"
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            exec:
              command:
                - "true"
            failureThreshold: 4
            initialDelaySeconds: 0
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 1
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              dockflow.shawiizz.dev/service: svc-custom-si
              dockflow.shawiizz.dev/stack: dockflow-shop-production
          matchLabelKeys:
            - pod-template-hash
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
