---
# Source: e2e-pvc/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-e2e-pvc
  labels:
    app.kubernetes.io/name: e2e-pvc
    app.kubernetes.io/instance: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: dockflow-local
  resources:
    requests:
      storage: 64Mi

---
# Source: e2e-pvc/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-e2e-pvc
  labels:
    app.kubernetes.io/name: e2e-pvc
    app.kubernetes.io/instance: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-pvc
      app.kubernetes.io/instance: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-pvc
        app.kubernetes.io/instance: data
    spec:
      containers:
        - name: writer
          image: busybox:1.37
          command: ["sh", "-c", "echo pvc-ready > /data/ready; sleep 36000"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-e2e-pvc


