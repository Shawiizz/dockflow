# Written by Dockflow's nginx plugin for shop-production: changes are overwritten by the next deploy.

map $http_upgrade $dockflow_shop_production_nginx_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com www.shop.example.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dockflow_shop_production_nginx_connection;
        proxy_read_timeout 300s;
    }
}
