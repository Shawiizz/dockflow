name: systemd
description: A systemd unit of the host, enabled, and restarted when it changed
inputs:
  - name: unit
    type: file
    required: true
    pattern: "[A-Za-z0-9@._-]+"
    description: the unit file, a Jinja template that sees these inputs; its name is the unit's unless name is given
  - name: name
    pattern: "[A-Za-z0-9@._-]+"
    description: the unit's name (default the file's name)
templates:
  - src: "{{ unit }}"
    dest: unit
uploads:
  - src: unit
    dest: "/etc/systemd/system/{{ name or unit.split('/')[-1] }}"
    mode: "644"
hooks:
  after_deploy:
    - name: enable and restart the unit
      host: sudo systemctl daemon-reload && sudo systemctl enable {{ (name or unit.split('/')[-1]) | shquote }} && sudo systemctl restart {{ (name or unit.split('/')[-1]) | shquote }}
      if_changed: "/etc/systemd/system/{{ name or unit.split('/')[-1] }}"
