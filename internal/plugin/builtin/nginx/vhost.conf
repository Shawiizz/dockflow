{%- set upgrade = ('dockflow_' ~ DOCKFLOW_STACK ~ '_' ~ id ~ '_connection') | replace('-', '_') -%}
{%- set cert = certificate_dir or ('/etc/letsencrypt/live/' ~ domain[0]) -%}
# Written by Dockflow's nginx plugin for {{ DOCKFLOW_STACK }}: changes are overwritten by the next deploy.

map $http_upgrade ${{ upgrade }} {
    default upgrade;
    ''      close;
}
{% if cloudflare %}
# Cloudflare's ranges: the client's address is in CF-Connecting-IP
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
{% endif %}
{%- if tls %}
server {
    listen 80;
    listen [::]:80;
    server_name {{ domain | join(' ') }};
    return 301 https://$host$request_uri;
}
{% endif %}
server {
{%- if tls %}
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate     {{ cert }}/fullchain.pem;
    ssl_certificate_key {{ cert }}/privkey.pem;
{%- else %}
    listen 80;
    listen [::]:80;
{%- endif %}
    server_name {{ domain | join(' ') }};

    client_max_body_size {{ max_body_size }};

    location / {
        proxy_pass http://{{ ('127.0.0.1:' ~ port) if port else upstream }};
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
{%- if cloudflare and not tls %}
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
{%- else %}
        proxy_set_header X-Forwarded-Proto $scheme;
{%- endif %}

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection ${{ upgrade }};
        proxy_read_timeout 300s;
    }
}
