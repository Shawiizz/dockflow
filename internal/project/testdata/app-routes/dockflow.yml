version: 1
app: shop
routes:
  - name: maintenance
    domains: [shop.example.com]
    path: /maintenance
    files: { host_path: /srv/maintenance }
  - domains: [shop.example.com]
    path: /maven
    redirect: "https://maven.shop.example.com{uri}"
    status: 301
  - name: archives
    domains: [archives.shop.example.com]
    files: { volume: archives, browse: true }
    auth: { user: team, password: "${ARCHIVES_PASSWORD}" }
  - domains: [api.shop.example.com]
    proxy: http://shop-api:8080
    network: shop
    error_pages:
      "502": { body: "<h1>The API is down</h1>" }
environments:
  production: {}
