services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        NODE_VERSION: ${NODE_VERSION}
        API_TOKEN: ${API_TOKEN}
      target: runtime
      cache_from: [type=gha]
      labels:
        org.opencontainers.image.source: https://github.com/acme/site
    ports:
      - "127.0.0.1:24000:3000"
