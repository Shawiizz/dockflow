services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
  app:
    image: ghcr.io/acme/app:1.4
    user: "1000"
    secrets:
      - source: api_token
        target: /etc/app/token
        uid: "1000"
        gid: "1000"
        mode: 0400
  proxy:
    image: nginx:1.27
    configs:
      - source: site
        target: /etc/nginx/conf.d/default.conf
  web:
    build:
      context: .
      secrets: [npm_token]
secrets:
  db_password:
    environment: DB_PASSWORD
  api_token:
    environment: API_TOKEN
  npm_token:
    environment: NPM_TOKEN
configs:
  site:
    content: |
      server {
        listen 80;
        location / { proxy_pass http://app:3000; }
      }
