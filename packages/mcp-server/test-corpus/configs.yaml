# Configuration corpus shared by the two validators of Dockflow configuration files.
#
#   packages/mcp-server/src/__tests__/corpus.test.ts   validate_config agrees with cliValid
#   cli/src/__tests__/kubernetes/mcp/corpus.test.ts     cliValid is the CLI schemas' verdict (U-MCP-01)
#
# Each row: name, file (config = .dockflow/config.yml, servers = .dockflow/servers.yml,
# root = dockflow.yml), yaml, cliValid, mcpErrors (fragments that must appear in the lines BOTH
# tools print), and for a servers row the optional orchestrator it is validated for (the k3s
# topology rules apply only then). Nunjucks placeholders are stored rendered.

# --- config.yml: accepted -------------------------------------------------------------------

- name: swarm project with defaults only
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop

- name: k3s project with defaults only
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s

- name: k3s Helm releases using every field
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s
    templates:
      - helm/web-values.yml
      - src: templates/api.yml
        dest: helm/api-values.yml
    helm:
      timeout: 1h30m
      releases:
        - name: web
          chart: podinfo
          repo: https://charts.example.com
          version: 6.15.0
          digest: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
          namespace: web-system
          values:
            replicaCount: 2
          values_files:
            - .dockflow/helm/web.yml
            - helm/web-values.yml
          timeout: 90s
        - name: api
          chart: oci://registry.example.com/charts/api
          version: v1.4.2-rc.1+build.7
          values_files:
            - helm/api-values.yml
          auth:
            username: deploy
            password: "s3cret"
        - name: cache
          chart: oci://registry.example.com/charts/cache
          version: 2.0.1
          role: accessory

- name: plain http chart repository (a deploy warning, not an error)
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: web
          chart: web
          repo: http://charts.example.com
          version: 1.0.0

- name: swarm proxy with the k3s-only keys at their defaults
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    proxy:
      enabled: true
      email: ops@example.com
      manage: true
      default_ingress_class: false

- name: k3s proxy that does not manage Traefik needs no email
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s
    proxy:
      enabled: true
      manage: false

- name: k3s proxy with a private ACME CA
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s
    proxy:
      enabled: true
      email: ops@example.com
      acme_ca_server: https://ca.example.com/acme/directory
      acme_ca_bundle: .dockflow/ca/root.pem
      default_ingress_class: true

- name: remote_build on swarm
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    options:
      remote_build: true

# --- config.yml: refused --------------------------------------------------------------------

- name: invalid project name
  file: config
  cliValid: false
  mcpErrors:
    - "project_name: Project name must contain only lowercase letters, numbers, and hyphens. Cannot start or end with a hyphen."
  yaml: |
    project_name: My_Shop

- name: helm without orchestrator (swarm by default)
  file: config
  cliValid: false
  mcpErrors:
    - "helm: helm releases require orchestrator: k3s"
  yaml: |
    project_name: shop
    helm:
      releases:
        - name: web
          chart: oci://registry.example.com/charts/web
          version: 1.0.0

- name: helm on an explicit swarm project
  file: config
  cliValid: false
  mcpErrors:
    - "helm: helm releases require orchestrator: k3s"
  yaml: |
    project_name: shop
    orchestrator: swarm
    helm:
      releases: []

- name: helm release name with capitals
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].name: name must be lowercase letters, digits and -, starting and ending with a letter or digit"
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: Web
          chart: oci://registry.example.com/charts/web
          version: 1.0.0

- name: helm release name longer than 53 characters
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].name: name must be at most 53 characters, the Helm release name limit"
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          chart: oci://registry.example.com/charts/web
          version: 1.0.0

- name: helm release with an empty chart
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].chart: chart must be a chart name, or an oci:// reference"
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: web
          chart: ""
          repo: https://charts.example.com
          version: 1.0.0

- name: helm repository that is not a URL
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].repo: repo must be an https:// or http:// URL"
