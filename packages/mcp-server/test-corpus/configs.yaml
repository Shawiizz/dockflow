# --- dockflow.yml: accepted -------------------------------------------------------------------

- name: flat project with a server
  file: root
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    servers:
      main:
        host: 203.0.113.10
        tags: [production]
    defaults:
      user: deploy
      port: 22

- name: flat project with two managers
  file: root
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    servers:
      a:
        tags: [production]
      b:
        tags: [production]

- name: flat project with a registry, a proxy and environment variables
  file: root
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    registry:
      type: dockerhub
      namespace: team
    proxy:
      enabled: true
      domains:
        production: shop.example.com
    servers:
      main:
        tags: [production]
    env:
      all:
        LOG_LEVEL: info

