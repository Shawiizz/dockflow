# --- servers.yml ----------------------------------------------------------------------------

- name: k3s fields on servers validated without an orchestrator
  file: servers
  cliValid: true
  mcpErrors: []
  yaml: |
    servers:
      cp-1:
        host: 203.0.113.11
        private_host: 10.0.0.11
        tags: [production]
        node_labels:
          zone: eu-west-1a
          example.com/tier: ""
      cp-2:
        host: 203.0.113.12
        private_host: "2001:db8::12"
        tags: [production]

- name: two managers on swarm
  file: servers
