# Configuration files both validators of Dockflow are checked against.
#
#   packages/mcp-server/src/__tests__/corpus.test.ts   validate_config agrees with cliValid
#   cli/src/__tests__/mcp-corpus.test.ts               cliValid is what the CLI schemas say
#
# Each row: name, file (config = .dockflow/config.yml, servers = .dockflow/servers.yml,
# root = dockflow.yml), yaml, cliValid, and mcpErrors: fragments that must appear in the issue
# lines of BOTH tools. A rule whose message only the MCP words (a missing or mistyped field) lists
# no fragment: the row pins the verdict only.

# --- config.yml: accepted ---------------------------------------------------------------------

- name: project name only
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop

- name: project name of one character
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: a

- name: project name of 63 characters
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

- name: podman as container engine
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    container_engine: podman

- name: remote build is a Swarm option
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    options:
      remote_build: true

- name: every registry type
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    registry:
      type: ghcr
      username: deploy
      password: secret
      token: abc
      namespace: team
      enabled: false
      additional_tags: ["{env}", latest]

- name: local registry
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    registry:
      type: local

- name: custom registry with a URL
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    registry:
      type: custom
      url: registry.example.com:5000

- name: proxy without an email
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    proxy:
      enabled: true
      domains:
        production: shop.example.com

- name: proxy with every key
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    proxy:
      enabled: true
      email: ops@example.com
      acme: false
      domains:
        production: shop.example.com
        staging: staging.example.com
      dashboard:
        enabled: true
        domain: traefik.example.com
      routes:
        - service: api
          domains:
            production: api.example.com
          path: /v1
          port: 8080
        - service: ws
          domains:
            production: shop.example.com
          path: /ws
      trusted_ips:
        - 173.245.48.0/20
        - 2400:cb00::/32
        - 10.0.0.1

- name: proxy dashboard disabled without a domain
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    proxy:
      dashboard:
        enabled: false

- name: public ports in every form
  file: config
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    firewall:
      public_ports:
        - 443
        - "51820/udp"
        - "8000-8010/tcp"
        - port: 5432
          from:
            - 203.0.113.0/24
            - 198.51.100.7
        - port: "9000"

