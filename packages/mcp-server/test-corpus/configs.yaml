  file: config
  cliValid: false
  mcpErrors:
    - 'helm.releases[0].values_files[0]: values file "helm/values.yml" is not rendered: Dockflow only renders files under .dockflow/ and files listed in templates'
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: web
          chart: oci://registry.example.com/charts/web
          version: 1.0.0
          values_files:
            - helm/values.yml

- name: helm registry login with an empty user name
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].auth.username: auth.username and auth.password must not be empty"
  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      releases:
        - name: web
          chart: oci://registry.example.com/charts/web
          version: 1.0.0
          auth:
            username: ""
            password: "s3cret"

- name: helm release declared twice
  file: config
  cliValid: false
  mcpErrors:
    - 'helm.releases[1].name: Helm release "web" is declared twice'
  yaml: |
    project_name: shop
    orchestrator: k3s
