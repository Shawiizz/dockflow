# --- dockflow.yml ---------------------------------------------------------------------------

- name: k3s flat project with a three-manager cluster
  file: root
  cliValid: true
  mcpErrors: []
  yaml: |
    project_name: shop
    orchestrator: k3s
    servers:
      cp-1:
