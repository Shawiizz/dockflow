  yaml: |
    project_name: shop
    orchestrator: k3s
    helm:
      timeout: soon

- name: helm empty values file entry
  file: config
  cliValid: false
  mcpErrors:
    - "helm.releases[0].values_files[0]: values_files entries must be non-empty paths"
  yaml: |
    project_name: shop
    orchestrator: k3s
