services:
  docs:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    deploy:
      replicas: 2
    x-dockflow:
      # the host's nginx terminates TLS and proxies the domain to the switch (external edge)
      routes:
        - domains: ["${DOCS_DOMAIN}"]
          port: 80
