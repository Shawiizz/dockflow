services:
  docs:
    image: dockflow-docs
    build:
      context: ../..
      dockerfile: Dockerfile.docs
    environment:
      ENV: "{{ env }}"
    restart: always
    ports:
      - "{{ current.env.docs_port }}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
