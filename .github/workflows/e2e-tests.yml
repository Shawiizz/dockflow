name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      suites:
        description: JSON array of classic suites (swarm, setup)
        type: string
        required: false
        default: '["swarm","setup"]'
      k3s_lanes:
        description: JSON array of k3s lanes
        type: string
        required: false
        default: '["k3s-core","k3s-lifecycle","k3s-rollback","k3s-day2","k3s-multinode","k3s-proxy-helm","k3s-ha","k3s-setup"]'
      binary_artifact:
        description: Artifact of the calling run containing dockflow-linux-x64; empty builds from source
        type: string
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classic:
    name: E2E (${{ matrix.suite }})
    if: ${{ (inputs.suites || '["swarm","setup"]') != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites || '["swarm","setup"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - name: Download binary under test
        if: ${{ inputs.binary_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: dist-under-test
      - name: Use binary under test
        if: ${{ inputs.binary_artifact }}
        run: |
          chmod +x dist-under-test/dockflow-linux-x64
          echo "DOCKFLOW_E2E_BINARY=$GITHUB_WORKSPACE/dist-under-test/dockflow-linux-x64" >> "$GITHUB_ENV"
      - name: Run E2E tests (${{ matrix.suite }})
        run: cd testing/e2e/${{ matrix.suite }} && bun test tests/ --timeout 300000
      - name: Show Swarm cluster logs on failure
        if: failure() && matrix.suite == 'swarm'
        run: |
          echo "=== Docker Compose Status ==="
          docker ps -a
          echo ""
          echo "=== Manager Docker Info ==="
          docker exec dockflow-test-manager docker info 2>/dev/null | grep -E "Storage|Server Version" || true
          echo ""
          echo "=== Manager Images ==="
          docker exec dockflow-test-manager docker images 2>/dev/null || true
          echo ""
          echo "=== Manager Node Logs ==="
          docker compose -f testing/e2e/docker/docker-compose.yml logs test-vm-manager 2>/dev/null || true
          echo ""
          echo "=== Worker Node Logs ==="
          docker compose -f testing/e2e/docker/docker-compose.yml logs test-vm-worker-1 2>/dev/null || true
          echo ""
          echo "=== Swarm Node Status ==="
          docker exec dockflow-test-manager docker node ls 2>/dev/null || echo "Could not fetch node status"
          echo ""
          echo "=== Swarm Services ==="
          docker exec dockflow-test-manager docker service ls 2>/dev/null || echo "Could not fetch services"
          echo ""
          echo "=== Swarm Service Tasks ==="
          # word-splitting is wanted here: one positional arg per service id
          # shellcheck disable=SC2046
          docker exec dockflow-test-manager docker service ps --no-trunc $(docker exec dockflow-test-manager docker service ls -q 2>/dev/null) 2>/dev/null || echo "Could not fetch service tasks"
          echo ""
          echo "=== Application Logs ==="
          docker exec dockflow-test-manager docker service logs test-app-test_web 2>&1 || echo "Could not fetch app logs"
          echo ""
          echo "=== Traefik Logs ==="
          docker exec dockflow-test-manager docker service logs traefik_traefik 2>&1 || echo "Could not fetch Traefik logs"
          echo ""
          echo "=== Traefik Service Labels ==="
          docker exec dockflow-test-manager docker service inspect traefik_traefik --format '{{json .Spec.Labels}}' 2>/dev/null | jq . || true
          echo ""
          echo "=== App Service Labels ==="
          docker exec dockflow-test-manager docker service inspect test-app-test_web --format '{{json .Spec.Labels}}' 2>/dev/null | jq . || true
          echo ""
          echo "=== Overlay Networks ==="
          docker exec dockflow-test-manager docker network ls --filter driver=overlay 2>/dev/null || true
      - name: Show setup container state on failure
        if: failure() && matrix.suite == 'setup'
        run: |
          echo "=== Container Status ==="
          docker ps -a --filter name=dockflow-test-setup
          echo ""
          echo "=== Provisioned State ==="
          docker exec dockflow-test-setup sh -c 'command -v docker && docker --version; ls -ld /var/lib/dockflow; id deploytest' 2>&1 || echo "Container not inspectable"
      - name: Cleanup
        if: always()
        run: bun run testing/e2e/teardown.ts 2>/dev/null || true

  k3s-node-image:
    name: k3s node image
    if: ${{ (inputs.k3s_lanes || 'default') != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: testing/e2e/.cache/downloads
          key: e2e-downloads-amd64-${{ hashFiles('cli/src/services/orchestrator/kubernetes/k3s/versions.ts', 'cli/src/services/orchestrator/kubernetes/versions.ts') }}
      - name: Cache test images
        uses: actions/cache@v4
        with:
          path: testing/e2e/.cache/images
          key: e2e-images-amd64-${{ hashFiles('testing/e2e/k3s/images.lock.json', 'cli/src/services/orchestrator/kubernetes/k3s/versions.ts') }}
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: bun run testing/e2e/k3s/tools/prepare-downloads.ts --arch amd64 --previous-pin
      - run: bun run testing/e2e/k3s/tools/prepare-images.ts --arch amd64
      - run: bun run testing/e2e/k3s/tools/build-node-image.ts --arch amd64 --tag dockflow-e2e-k3s-node:ci --save testing/e2e/.cache/node-image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-k3s-node-image
          path: testing/e2e/.cache/node-image.tar.zst
          retention-days: 1
          compression-level: 0

  k3s:
    name: E2E (${{ matrix.lane }})
    needs: k3s-node-image
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.k3s_lanes || '["k3s-core","k3s-lifecycle","k3s-rollback","k3s-day2","k3s-multinode","k3s-proxy-helm","k3s-ha","k3s-setup"]') }}
    env:
      DOCKFLOW_E2E_LANE: ${{ matrix.lane }}
      DOCKFLOW_E2E_NODE_IMAGE: dockflow-e2e-k3s-node:ci
      DOCKFLOW_E2E_ARTIFACTS: ${{ github.workspace }}/testing/e2e/.artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Prepare host kernel
        run: |
          sudo modprobe br_netfilter || true
          sudo modprobe overlay || true
          sudo modprobe wireguard || true
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-k3s-node-image
          path: testing/e2e/.cache
      - run: zstd -dc testing/e2e/.cache/node-image.tar.zst | docker load
      - name: Download binary under test
        if: ${{ inputs.binary_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: dist-under-test
      - name: Use binary under test
        if: ${{ inputs.binary_artifact }}
        run: |
          chmod +x dist-under-test/dockflow-linux-x64
          echo "DOCKFLOW_E2E_BINARY=$GITHUB_WORKSPACE/dist-under-test/dockflow-linux-x64" >> "$GITHUB_ENV"
      - name: Run lane
        run: cd testing/e2e/k3s && bun run run.ts "${{ matrix.lane }}"
      - name: Upload debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug-${{ matrix.lane }}-${{ github.run_attempt }}
          path: testing/e2e/.artifacts
          retention-days: 7
      - name: Teardown
        if: always()
        run: bun run testing/e2e/teardown.ts || true

  summary:
    name: E2E summary
    if: always()
    needs: [classic, k3s-node-image, k3s]
    runs-on: ubuntu-24.04
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Fail when any e2e job failed or was cancelled
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
      # K67 (c): on push and pull_request "skipped" must not count as green for the k3s lanes, or a
      # workflow edit that empties the lane list (k3s_lanes: '[]', a bad `if:`) would keep the required
      # check green on main. In a workflow_call from publish-cli.yml, github.event_name is the caller's
      # event (the tag push), so the release gate gets the same guard.
      - name: Require the k3s lanes and the classic suites to have run
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: echo "$NEEDS" | jq -e '.["k3s-node-image"].result == "success" and .k3s.result == "success" and .classic.result == "success"'
