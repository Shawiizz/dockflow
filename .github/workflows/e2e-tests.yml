name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Callable so the release pipeline can gate on the suites that matter to it.
  workflow_call:
    inputs:
      suites:
        description: JSON array of suites to run
        type: string
        required: false
        default: '["swarm", "setup"]'
      binary_artifact:
        description: Artifact of the calling run that holds dockflow-linux-x64; empty builds from source
        type: string
        required: false
        default: ''

# A newer push to a pull request replaces its run; a push to a branch or a release never cancels.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.suite }})
    if: ${{ (inputs.suites || '["swarm", "setup"]') != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites || '["swarm", "setup"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install CLI dependencies
        run: |
          cd cli && bun install --frozen-lockfile

      - name: Download the binary under test
        if: ${{ inputs.binary_artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.binary_artifact }}
          path: dist-under-test

      - name: Use the binary under test
        if: ${{ inputs.binary_artifact }}
        run: |
          chmod +x dist-under-test/dockflow-linux-x64
          echo "DOCKFLOW_E2E_BINARY=$GITHUB_WORKSPACE/dist-under-test/dockflow-linux-x64" >> "$GITHUB_ENV"

      - name: Run E2E Tests (${{ matrix.suite }})
        run: |
          cd testing/e2e/${{ matrix.suite }} && bun test tests/ --timeout 300000

      - name: Dump the Swarm cluster state on failure
        if: failure() && matrix.suite == 'swarm'
        run: |
          bun run testing/e2e/helpers/debug-dump.ts swarm

      - name: Upload the Swarm dump
        if: failure() && matrix.suite == 'swarm'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-swarm-dump-${{ github.run_attempt }}
          path: testing/e2e/.artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Show setup container state on failure
        if: failure() && matrix.suite == 'setup'
        run: |
          echo "=== Container Status ==="
          docker ps -a --filter name=dockflow-test-setup
          echo ""
          echo "=== Provisioned State ==="
          docker exec dockflow-test-setup sh -c 'command -v docker && docker --version; ls -ld /var/lib/dockflow; id deploytest' 2>&1 || echo "Container not inspectable"

      - name: Cleanup
        if: always()
        run: |
          bun run testing/e2e/teardown.ts 2>/dev/null || true

  # One check for branch protection and for the release gate: a suite that was cancelled, or a
  # matrix emptied by a bad edit, must not leave the run green.
  summary:
    name: E2E summary
    if: always()
    needs: [e2e]
    runs-on: ubuntu-24.04
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Fail when any suite failed or was cancelled
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

      # In a call from the release workflow github.event_name is the caller's (the tag push), so the
      # release gate gets the same guard.
      - name: Require the suites to have run
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          echo "$NEEDS" | jq -e '.e2e.result == "success"'
