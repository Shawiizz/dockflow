name: Publish CLI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Extract version from tag
        id: version
        run: |
          # Tag is already the version (2.0.0)
          VERSION=$GITHUB_REF_NAME
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Building CLI version: $VERSION"

      - name: Set version in package.json files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'cli/package.json', 'packages/cli/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
              console.log('✓ ' + p + ' → ' + '$VERSION');
            }
          "

      - name: Install CLI dependencies
        run: |
          cd cli
          bun install --frozen-lockfile

      - name: Typecheck
        run: |
          cd cli
          bun run typecheck

      - name: Lint
        run: |
          cd cli
          bun run lint

      - name: Unit tests
        run: |
          cd cli
          bun test src/

      - name: Install UI dependencies
        run: |
          cd cli/ui
          pnpm install --frozen-lockfile

      - name: Build UI
        run: |
          cd cli/ui
          pnpm build

      - name: Build all platforms
        run: |
          cd cli
          bun run scripts/build.ts

      - name: Checksums of the release binaries (K57 (c), design-05 F36)
        run: |
          cd cli/dist
          sha256sum dockflow-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          grep -q ' dockflow-linux-x64$' SHA256SUMS && grep -q ' dockflow-linux-arm64$' SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dockflow-binaries-${{ steps.version.outputs.version }}
          path: cli/dist/*
          retention-days: 7

  # K67 (b): the release is gated on the same checks as main (coverage floor, generated docs
  # region, message catalogue sync, Windows unit job, e2e harness typecheck/lint, MCP build and
  # tests), not only on build's own typecheck/lint/unit tests. Runs in parallel with build.
  checks:
    uses: ./.github/workflows/cli-checks.yml
    secrets: inherit

  e2e:
    needs: build
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      suites: '["swarm","setup"]'
      k3s_lanes: '["k3s-core","k3s-lifecycle","k3s-rollback","k3s-day2","k3s-multinode","k3s-proxy-helm","k3s-ha","k3s-setup"]'
      binary_artifact: dockflow-binaries-${{ needs.build.outputs.version }}

  release:
    needs: [build, checks, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dockflow-binaries-${{ needs.build.outputs.version }}
          path: cli/dist

      - name: SHA256SUMS present and matching (release-blocking)
        run: cd cli/dist && test -s SHA256SUMS && sha256sum -c SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dockflow ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: cli/dist/*
          generate_release_notes: true
          body: |
            ## Dockflow ${{ needs.build.outputs.version }}

            ### Installation

            **Linux x64:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockflow-linux-x64 -o /usr/local/bin/dockflow
            chmod +x /usr/local/bin/dockflow
            ```

            **Linux ARM64:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockflow-linux-arm64 -o /usr/local/bin/dockflow
            chmod +x /usr/local/bin/dockflow
            ```

            **macOS x64:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockflow-macos-x64 -o /usr/local/bin/dockflow
            chmod +x /usr/local/bin/dockflow
            ```

            **macOS ARM64 (Apple Silicon):**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/dockflow-macos-arm64 -o /usr/local/bin/dockflow
            chmod +x /usr/local/bin/dockflow
            ```

            **Windows x64:**
            Download `dockflow-windows-x64.exe` and add it to your PATH.

            **npm:**
            ```bash
            npm install -g @dockflow-tools/cli
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version from tag
        run: |
          cd packages/cli
          npm version ${{ needs.build.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          cd packages/cli
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag dev
          else
            npm publish --access public
          fi
