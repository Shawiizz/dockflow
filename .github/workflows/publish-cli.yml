name: Publish CLI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

# A tag is released once, and a second push must wait for the first to finish
concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Extract version from tag
        id: version
        run: |
          # Tag is already the version (2.0.0)
          VERSION=$GITHUB_REF_NAME
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Building CLI version: $VERSION"

      - name: Set version in package.json files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          node -e "
            const fs = require('fs');
            for (const p of ['package.json', 'cli/package.json', 'packages/cli/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
              console.log('✓ ' + p + ' → ' + '$VERSION');
            }
          "

      - name: Install CLI dependencies
        run: |
          cd cli
          bun install --frozen-lockfile

      - name: Install UI dependencies
        run: |
          cd cli/ui
          pnpm install --frozen-lockfile

      - name: Build UI
        run: |
          cd cli/ui
          pnpm build

      - name: Build all platforms
        run: |
          cd cli
          bun run scripts/build.ts

      # Every installer (npm package, install.sh, install.ps1, `dockflow setup user@host`)
      # refuses a binary whose SHA-256 differs from the one listed here.
      - name: Checksums
        run: |
          cd cli/dist
          for binary in dockflow-linux-x64 dockflow-linux-arm64 dockflow-windows-x64.exe dockflow-macos-x64 dockflow-macos-arm64; do
            if [ ! -s "$binary" ]; then
              echo "::error::$binary was not built"
              exit 1
            fi
          done
          sha256sum dockflow-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dockflow-binaries-${{ steps.version.outputs.version }}
          path: cli/dist/*
          retention-days: 7

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: dockflow-checksums-${{ steps.version.outputs.version }}
          path: cli/dist/SHA256SUMS
          retention-days: 7

  # The same checks as main: typecheck, lint, unit tests, the e2e harness and the MCP package.
  checks:
    uses: ./.github/workflows/cli-checks.yml

  # The setup suite runs the compiled binary, so it is the only one that can catch a
  # packaging regression before the artifact reaches npm. It tests the artifact built above.
  # The swarm suite covers deployment behaviour and already runs on every push to main.
  e2e:
    needs: build
    uses: ./.github/workflows/e2e-tests.yml
    with:
      suites: '["setup"]'
      binary_artifact: dockflow-binaries-${{ needs.build.outputs.version }}

  # Nothing is published before the checks and the e2e of the built binaries have passed:
  # install.sh and install.ps1 read the latest release.
  release:
    needs: [build, checks, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: dockflow-binaries-${{ needs.build.outputs.version }}
          path: cli/dist

      - name: The checksums list every binary and match
        run: |
          cd cli/dist
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          for binary in dockflow-linux-x64 dockflow-linux-arm64 dockflow-windows-x64.exe dockflow-macos-x64 dockflow-macos-arm64; do
            grep -Eq "^[0-9a-f]{64}  $binary\$" SHA256SUMS || { echo "::error::SHA256SUMS lists no checksum for $binary"; exit 1; }
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dockflow ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: cli/dist/*
          generate_release_notes: true
          body: |
            ## Dockflow ${{ needs.build.outputs.version }}

            ### Installation

            Each of these checks the binary against this release's `SHA256SUMS` before installing it.

            **Linux / macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | DOCKFLOW_VERSION=${{ github.ref_name }} bash
            ```

            **Windows (PowerShell):**
            ```powershell
            $env:DOCKFLOW_VERSION = "${{ github.ref_name }}"; irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            **npm:**
            ```bash
            npm install -g @dockflow-tools/cli@${{ github.ref_name }}
            ```

            ### Download by hand

            Download the binary of your platform and `SHA256SUMS` from the assets below into one
            directory, check the binary there, then put it on your PATH:
            ```bash
            grep ' dockflow-linux-x64$' SHA256SUMS | sha256sum --check          # Linux
            grep ' dockflow-macos-arm64$' SHA256SUMS | shasum -a 256 --check    # macOS
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [build, release]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version from tag
        run: |
          cd packages/cli
          npm version ${{ needs.build.outputs.version }} --no-git-tag-version --allow-same-version

      # The package carries the SHA-256 of the binaries its version downloads
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: dockflow-checksums-${{ needs.build.outputs.version }}
          path: packages/cli

      - name: Check the packed checksums
        run: |
          cd packages/cli
          for binary in dockflow-linux-x64 dockflow-linux-arm64 dockflow-windows-x64.exe dockflow-macos-x64 dockflow-macos-arm64; do
            grep -Eq "^[0-9a-f]{64}  $binary\$" SHA256SUMS || { echo "::error::SHA256SUMS lists no checksum for $binary"; exit 1; }
          done
          npm pack --dry-run 2>&1 | grep -q 'SHA256SUMS' || { echo "::error::SHA256SUMS is not packed"; exit 1; }

      - name: Publish to npm
        run: |
          cd packages/cli
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag dev
          else
            npm publish --access public
          fi

  # The docs pin the latest stable release in their examples: deploy them once npm serves it
  docs:
    needs: [build, publish-npm]
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
