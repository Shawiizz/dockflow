name: CLI Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # callable, so the release gate runs the same checks (D24, K67 (b))
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - run: cd cli && bun run typecheck
      - run: cd cli && bun run lint
      - name: Unit tests
        run: cd cli && bun test src/ --coverage --coverage-reporter=lcov --coverage-reporter=text --reporter=junit --reporter-outfile=junit.xml
      - name: Coverage gate (Kubernetes modules)
        run: cd cli && bun run scripts/check-coverage.ts
      - name: Generated documentation is current
        run: cd cli && bun run scripts/gen-compose-support.ts --check
      - name: MCP message catalogue is current
        run: cd cli && bun run scripts/sync-mcp-messages.ts --check
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-unit-junit
          path: cli/junit.xml
          retention-days: 7

  kubernetes-unit-windows:
    name: Kubernetes unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - run: cd cli && bun test src/__tests__/kubernetes

  # The tree below cli/ has no tsconfig/biome config of its own (P86, ci-release-gate): without this
  # job `bun run typecheck` / `bun run lint` above never see it, so a broken e2e harness file would
  # only surface once an e2e lane actually ran it.
  e2e-checks:
    name: E2E harness typecheck & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: cd cli && bun install --frozen-lockfile
      - name: Typecheck (testing/e2e)
        run: cd cli && bunx tsc --noEmit -p ../testing/e2e/tsconfig.json
      - name: Lint (testing/e2e)
        run: cd cli && bunx biome check --config-path=../testing/e2e/biome.json ../testing/e2e

  mcp:
    name: MCP server build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd packages/mcp-server && npm ci && npm run build && npm run typecheck:test && npm test
      - name: No test compiled into the package
        run: cd packages/mcp-server && test ! -e dist/__tests__
