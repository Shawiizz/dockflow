name: Publish MCP

on:
  push:
    tags:
      - 'mcp-[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.2)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The input reaches the shell through the environment and is checked before it is used:
      # it is typed by whoever starts the workflow.
      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Strip "mcp-" prefix from tag (mcp-1.0.2 → 1.0.2)
            VERSION="${GITHUB_REF_NAME#mcp-}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing MCP server v$VERSION"

      - name: Install dependencies
        run: cd packages/mcp-server && npm ci

      - name: Build
        run: cd packages/mcp-server && npm run build

      - name: Typecheck and test
        run: cd packages/mcp-server && npm run typecheck:test && npm test

      - name: Set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cd packages/mcp-server && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd packages/mcp-server
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag dev --provenance
          else
            npm publish --access public --provenance
          fi
