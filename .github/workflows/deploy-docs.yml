name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cli/ui/**'
  workflow_dispatch:
  # Every stable release (publish-cli.yml): the docs pin it in their install and CI examples,
  # reading npm's latest when they build (docs/cli-version.mjs)
  workflow_call:
    inputs:
      version:
        description: The release the docs must show, once npm serves it as latest
        type: string
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # one docs deploy at a time: a push to main and a release would otherwise meet on the deploy lock
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # main's docs, also when a release tag calls this workflow
          ref: main

      # The version reaches the shell through the environment, checked, never expanded into a
      # command: the secrets are in this job's environment.
      - name: Wait for npm to serve the release
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version: $VERSION"; exit 1; }
          for attempt in $(seq 1 30); do
            [ "$(npm view @dockflow-tools/cli version)" = "$VERSION" ] && exit 0
            sleep 10
          done
          echo "::error::npm does not serve $VERSION as latest"
          exit 1

      - name: Deploy docs
        env:
          CLI_VERSION: ${{ inputs.version || 'latest' }}
          DOCKFLOW_SECRETS: ${{ toJSON(secrets) }}
        run: |
          [[ "$CLI_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+|latest)$ ]] || { echo "::error::not a release version: $CLI_VERSION"; exit 1; }
          npx "@dockflow-tools/cli@$CLI_VERSION" deploy production "main-$(git rev-parse HEAD)"
