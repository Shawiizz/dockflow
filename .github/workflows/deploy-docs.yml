name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cli/ui/**'
      - 'cli/src/api/types.ts'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  # Every stable release (publish-cli.yml): the docs pin it in their install and CI examples,
  # reading npm's latest when they build (docs/cli-version.mjs)
  workflow_call:
    inputs:
      version:
        description: The release the docs must show, once npm serves it as latest
        type: string
        required: false
    secrets:
      PRODUCTION_CONNECTION:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # one docs deploy at a time: a push to main and a release would otherwise meet on the deploy lock
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # main's docs, also when a release tag calls this workflow
          ref: main

      # The version reaches the shell through the environment, checked, never expanded into a
      # command: a secret is in this job's environment.
      - name: Wait for npm to serve the release
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version: $VERSION"; exit 1; }
          for attempt in $(seq 1 30); do
            [ "$(npm view @dockflow-tools/cli version)" = "$VERSION" ] && exit 0
            sleep 10
          done
          echo "::error::npm does not serve $VERSION as latest"
          exit 1

      # Dockflow v2 deploys the site: pinned, installed from its signed release
      - name: Install Dockflow
        run: curl -fsSL https://raw.githubusercontent.com/Shawiizz/dockflow/v4.0.0-alpha.1/install.sh | sh -s -- --version v4.0.0-alpha.1

      - name: Deploy docs
        env:
          # the docs server's connection string alone, not every secret of the repository
          PRODUCTION_CONNECTION: ${{ secrets.PRODUCTION_CONNECTION }}
        run: dockflow -C docs deploy production --version "main-$(git rev-parse --short HEAD)" --wait-lock 10m
