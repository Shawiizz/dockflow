name: npm

# Publishes the npm packages of a release (ADR-0020), from its binaries: @dockflow-tools/cli and
# its per-platform optional dependencies. Called by the release workflow, or run by hand for a
# release whose packages were not published. Needs the NPM_TOKEN secret, skipped without it.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The release, v<semver>"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: the packages are bound to this workflow
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::no NPM_TOKEN secret: the npm packages are not published"; exit 0
          fi
          gh release download "$TAG" --dir dist --pattern 'dockflow-*' --pattern SHA256SUMS
          (cd dist && sha256sum -c --quiet SHA256SUMS)
          sh packaging/npm/pack.sh "${TAG#v}" dist npm
          # every release goes to the latest tag: the versions before 1.0.0-alpha are deprecated
          publish() {
            # a version already published (a run started again) is left as it is
            if npm view "$(node -p "require('./$1/package.json').name")@${TAG#v}" version >/dev/null 2>&1; then
              echo "$1: ${TAG#v} is already published"; return
            fi
            # ./ makes it a directory: npm reads npm/cli as a GitHub repository
            npm publish --provenance --access public --tag latest "./$1"
          }
          # the platforms first: the package that depends on them comes last
          for d in npm/cli-*; do publish "$d"; done
          publish npm/cli
