name: npm

# Publishes the npm packages of a release (ADR-0020), from its binaries: @dockflow-tools/cli and
# its per-platform optional dependencies. Started by the release workflow, or by hand for a release
# whose packages were not published.
#
# No token: npm trusts this workflow (trusted publishing, OIDC). Each package names it, by its file
# name, in its settings on npmjs.com: renaming this file stops the publishing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release, v<semver>"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # trusted publishing, and the packages' provenance
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: publish
        run: |
          # trusted publishing needs npm 11.5.1 or later
          npm install -g npm@11
          gh release download "$TAG" --dir dist --pattern 'dockflow-*' --pattern SHA256SUMS
          (cd dist && sha256sum -c --quiet SHA256SUMS)
          sh packaging/npm/pack.sh "${TAG#v}" dist npm
          # every release goes to the latest tag: the versions before 1.0.0-alpha are deprecated
          published() {
            npm view "$(node -p "require('./$1/package.json').name")@${TAG#v}" version >/dev/null 2>&1
          }
          publish() {
            # a version already published (a run started again) is left as it is
            if published "$1"; then
              echo "$1: ${TAG#v} is already published"; return
            fi
            # ./ makes it a directory: npm reads npm/cli as a GitHub repository. A transient
            # failure (Sigstore's transparency log answering 409 to a retried upload) is retried
            # once, unless the package went through all the same.
            npm publish --provenance --access public --tag latest "./$1" && return
            sleep 30
            if published "$1"; then
              echo "$1: published despite the error"; return
            fi
            npm publish --provenance --access public --tag latest "./$1"
          }
          # the platforms first: the package that depends on them comes last
          for d in npm/cli-*; do publish "$d"; done
          publish npm/cli
