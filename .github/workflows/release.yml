name: Release

# Publishes a release (ADR-0020), once the whole CI has passed on the released commit: a tag
# v<semver> pushed on main, a commit on main that writes the version into .github/release, or
# a run started by hand on main with the version. The release creates the tag on that commit.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/release]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, v<semver>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          INPUT: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) tag="$GITHUB_REF_NAME" ;;
            *) tag="${INPUT:-$(tr -d '[:space:]' < .github/release)}" ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::releases are made from main"; exit 1
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $tag"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  ci:
    needs: [version]
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # keyless signing: the certificate binds the signature to this workflow and its ref
      id-token: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: make snapshot VERSION="${TAG#v}"
      - uses: sigstore/cosign-installer@v3
      - name: sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # never marked latest: which release the repository's page leads to is the owner's call;
          # --target creates the tag on the released commit when it does not exist yet
          gh release create "$TAG" dist/* install.sh $flags --latest=false --target "$GITHUB_SHA" \
            --title "Dockflow $TAG" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$TAG/install.sh | sh -s -- --version $TAG\`. The binaries are listed in SHA256SUMS, signed with Sigstore (SHA256SUMS.sigstore.json)."
