name: Release

# Publishes a release (ADR-0020), once the whole CI has passed on the released commit, from a
# pushed tag v<semver> only: the signature then names the tag, which the installers require.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a version: $tag"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  ci:
    needs: [version]
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # keyless signing: the certificate binds the signature to this workflow and its ref
      id-token: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: make snapshot VERSION="${TAG#v}"
      - uses: sigstore/cosign-installer@v3
      - name: sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # never marked latest: which release the repository's page leads to is the owner's call;
          # --target creates the tag on the released commit when it does not exist yet
          gh release create "$TAG" dist/* install.sh install.ps1 $flags --latest=false --target "$GITHUB_SHA" \
            --title "Dockflow $TAG" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$TAG/install.sh | sh -s -- --version $TAG\`, or on Windows \`& ([scriptblock]::Create((irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$TAG/install.ps1))) -Version $TAG\`. The binaries are listed in SHA256SUMS, signed with Sigstore (SHA256SUMS.sigstore.json). The dockflow-agent-linux-* binaries are the agents the other binaries send to servers."

  # The npm packages, from the release's binaries: @dockflow-tools/cli and its per-platform optional
  # dependencies. Started as a run of its own: npm trusts npm.yml by name, and a workflow
  # called from this one would present itself as release.yml.
  npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - run: gh workflow run npm.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  # The Homebrew formula: written from the release's checksums, installed once to check it, then
  # committed on main, as this repository is its own tap.
  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: write the formula
        run: |
          gh release download "$TAG" --dir "$RUNNER_TEMP/release" --pattern SHA256SUMS
          mkdir -p Formula
          sh packaging/homebrew.sh "${TAG#v}" "$RUNNER_TEMP/release/SHA256SUMS" >Formula/dockflow.rb
      - name: install it
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git dockflow/check
          cp Formula/dockflow.rb "$(brew --repository)/Library/Taps/dockflow/homebrew-check/Formula/"
          brew install dockflow/check/dockflow
          "$(brew --prefix)/bin/dockflow" version | grep -F "${TAG#v}"
      - name: commit it
        run: |
          # the history carries the owner's name only
          git config user.name "Shawiiz_z"
          git config user.email "shaweereso@gmail.com"
          git add Formula/dockflow.rb
          git commit -m "chore(homebrew): dockflow ${TAG#v}"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
