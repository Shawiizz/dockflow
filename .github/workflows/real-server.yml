name: Real servers

# Fresh DigitalOcean droplets: provisioning, cloud-init, Let's Encrypt's staging, the edges, nginx
# and the port filter (ADR-0019). Run by hand before a release; each run costs a few cents.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: real-server

jobs:
  real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test -tags real
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: go test -tags real -count=1 -v -timeout 60m ./test/real/
