name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the release workflow runs the whole CI on the tagged commit first
  workflow_call:
  # the image bumps' pull requests, which the GITHUB_TOKEN that opens them cannot start
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run --build-tags e2e,real ./...
      - name: govulncheck
        # fails on a known vulnerability that the code can reach
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    name: unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        env:
          DOCKFLOW_CONTRACT: "1"
        run: go test -count=1 ./...

  e2e:
    name: e2e (${{ matrix.docker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: ["27-dind", "dind"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -tags e2e
        env:
          DOCKFLOW_E2E_DIND_IMAGE: mirror.gcr.io/library/docker:${{ matrix.docker }}
        run: go test -tags e2e -count=1 -v -timeout 20m ./test/e2e/

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build the CLI
        run: |
          go build -o "$RUNNER_TEMP/bin/dockflow" ./cmd/dockflow
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/shop"
          printf 'version: 1\napp: shop\nenvironments:\n  production: {}\n' >"$RUNNER_TEMP/shop/dockflow.yml"
          printf 'services:\n  web:\n    image: nginx:1.27\n' >"$RUNNER_TEMP/shop/compose.yml"
      - name: the action runs a command
        uses: ./
        with:
          version: none
          command: validate production
          working-directory: ${{ runner.temp }}/shop
      # nothing to install before the repository's first release
      - name: is there a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq length)" >>"$GITHUB_OUTPUT"
      - name: the action installs the newest release
        if: steps.release.outputs.count != '0'
        uses: ./
        with:
          command: version
          working-directory: ${{ runner.temp }}/shop

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is there a release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "count=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq length)" >>"$GITHUB_OUTPUT"
      - name: install.ps1 installs the newest release
        if: steps.release.outputs.count != '0'
        shell: powershell
        run: |
          .\install.ps1 -Dir "$env:RUNNER_TEMP\dockflow"
          & "$env:RUNNER_TEMP\dockflow\dockflow.exe" version
          if ($LASTEXITCODE) { exit 1 }

  site:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the current release
      - name: build the image
        run: |
          # the newest release tag, or a placeholder in a fork without tags
          v=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 0.0.0-ci)
          docker build --build-arg DOCKFLOW_RELEASE="$v" -t dockflow-site site
      - name: serve it
        run: |
          docker run -d --name site -p 127.0.0.1:8080:80 dockflow-site
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>'
          curl -fsS http://127.0.0.1:8080/start/quickstart/ | grep -q 'Quickstart'
          curl -fsS http://127.0.0.1:8080/reference/dockflow-yml/ | grep -q 'dockflow.yml'
          curl -fsS http://127.0.0.1:8080/api/search | grep -q 'Quickstart'
          curl -fsS http://127.0.0.1:8080/llms.txt | grep -q '/start/quickstart/'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page/)" = 404

  snapshot:
    name: snapshot builds
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: make snapshot VERSION=snapshot-${GITHUB_SHA::12}
      - name: the npm packages run the binary
        run: |
          sh packaging/npm/pack.sh 0.0.0-ci dist "$RUNNER_TEMP/npm"
          m="$RUNNER_TEMP/try/node_modules/@dockflow-tools"
          mkdir -p "$m"
          cp -r "$RUNNER_TEMP/npm/cli" "$RUNNER_TEMP/npm/cli-linux-x64" "$m/"
          node "$m/cli/bin/dockflow.js" version | grep -F "snapshot-${GITHUB_SHA::12}"
          node "$m/cli/bin/dockflow.js" no-such-command && exit 1 || test $? -eq 2
      - name: the Homebrew formula is valid Ruby
        run: |
          sh packaging/homebrew.sh 0.0.0-ci dist/SHA256SUMS >"$RUNNER_TEMP/dockflow.rb"
          ruby -c "$RUNNER_TEMP/dockflow.rb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockflow-snapshot
          path: dist/
          retention-days: 14
