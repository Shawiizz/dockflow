version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  # the documentation site: its lockfile is bun.lock
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # the site's image: bun to build it, Caddy to serve it
  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: weekly
